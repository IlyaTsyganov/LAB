name: Publish prepared local release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify prepared archive and unpack reviewed source
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check lab-0.1.0-win-x64.zip.sha256
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          with ZipFile('lab-source-v0.1.0.zip') as archive:
              for item in archive.infolist():
                  path = PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts or '.git' in path.parts:
                      raise ValueError('Unsafe source archive entry')
              archive.extractall('.')
          for path in ('lab.csproj', 'README.md', 'LICENSE', 'docs/release-0.1.0.md'):
              if not Path(path).is_file():
                  raise ValueError('Missing source file: ' + path)
          PY
      - name: Publish source and release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lab-release
          cp lab-0.1.0-win-x64.zip lab-0.1.0-win-x64.zip.sha256 /tmp/lab-release/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm lab-source-v0.1.0.zip lab-0.1.0-win-x64.zip lab-0.1.0-win-x64.zip.sha256
          git restore --source=HEAD -- .github/workflows/publish-prepared-release.yml
          git add --all
          git commit -m 'Publish LAB source and prepared 0.1.0 release'
          git push origin HEAD:main
          gh release create v0.1.0 /tmp/lab-release/lab-0.1.0-win-x64.zip /tmp/lab-release/lab-0.1.0-win-x64.zip.sha256 --target "$(git rev-parse HEAD)" --title 'LAB 0.1.0' --notes-file docs/release-0.1.0.md --prerelease
