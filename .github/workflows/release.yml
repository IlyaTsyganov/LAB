name: Publish LAB

on:
  push:
    branches: [main]
    paths:
      - lab.csproj
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lab-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version=([xml](Get-Content -LiteralPath lab.csproj -Raw)).Project.PropertyGroup.Version
          if($version -notmatch '^\d+\.\d+\.\d+$'){throw 'Expected a three-part release version.'}
          if(!(Test-Path -LiteralPath "docs/release-$version.md")){throw 'Release notes are missing.'}
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Build and validate Windows package
        shell: pwsh
        run: ./build.ps1 -Test -SkipVulkanProbe
      - name: Publish stable release
        shell: pwsh
        env:
          LAB_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$env:LAB_VERSION" artifacts/LAB.zip artifacts/LAB.zip.sha256 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "LAB $env:LAB_VERSION" --notes-file "docs/release-$env:LAB_VERSION.md" --latest
          if($LASTEXITCODE){throw 'Release publication failed.'}
