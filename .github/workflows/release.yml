name: Publish LAB 1.0

on:
  push:
    branches: [main]
    paths:
      - lab.csproj
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lab-release-1.0
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify release version
        shell: pwsh
        run: |
          $version=([xml](Get-Content -LiteralPath lab.csproj -Raw)).Project.PropertyGroup.Version
          if($version -ne '1.0.0'){throw 'This workflow publishes LAB 1.0 only.'}
      - name: Build and validate Windows package
        shell: pwsh
        run: ./build.ps1 -Test -SkipVulkanProbe
      - name: Publish stable release
        shell: pwsh
        run: |
          gh release create v1.0 artifacts/lab-1.0-win-x64.zip artifacts/lab-1.0-win-x64.zip.sha256 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'LAB 1.0' --notes-file docs/release-1.0.md --latest
          if($LASTEXITCODE){throw 'Release publication failed.'}
