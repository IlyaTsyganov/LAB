<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>LAB</title><link rel="stylesheet" href="inline.css"><link rel="stylesheet" href="desktop.css"></head><body><div id="lab-frost-layouts">
      <div class="lab-app lab-inline" data-design="inline" aria-label="Inline Controls UAC Frost">
        <header class="lab-header"><div class="lab-brand"><span class="lab-emblem" role="img" aria-label="Original LAB emblem"></span><div class="lab-word">LAB</div></div></header>
        <div class="window-actions"><button type="button" data-window="minimize" aria-label="Minimize"><span class="minimize-icon"></span></button><button type="button" data-window="maximize" aria-label="Maximize or restore"><span class="maximize-icon"></span></button><button type="button" data-window="close" aria-label="Close"><span class="close-icon"></span></button></div>
        <main class="lab-content"><div class="lab-heading"><div><h1>Game & HUD</h1><p class="lab-small">Let me help you to see, Slayer</p></div><span class="lab-status">Game not running</span></div>
          <section class="lab-panel lab-gamebar" aria-label="Game executable and launch"><div data-slot="path"></div><button type="button" class="lab-button lab-primary cursor-interaction" data-launch>Launch game</button></section>
          <section class="lab-panel lab-inline-panel"><div class="lab-meter-heading"><h2>Speedometers</h2><label class="lab-master-toggle"><span>Enabled</span><input type="checkbox" class="lab-switch cursor-interaction" data-all-meters aria-label="Enable speedometers"></label></div><div class="lab-inline-head" aria-hidden="true"><span>Speedometer</span><span>Visible</span><span>X · px</span><span>Y · px</span><span>Size</span><span>Color</span></div><div data-slot="inline-meters"></div></section>
          <section class="lab-panel"><h2>Game options</h2><div class="lab-inline-fixes" data-slot="fixes"></div><div class="lab-inline-tint" data-slot="tint"></div></section>
        </main><footer class="lab-footer"><span data-feedback aria-live="polite">Design preview</span><label class="lab-window-size">Window <select data-window-size aria-label="Window size"><option value="mini">Mini</option><option value="compact" selected>Compact</option><option value="comfortable">Comfortable</option></select></label><button type="button" class="lab-text-button cursor-interaction" data-help>Help</button></footer>
      </div>
<template id="lab-path-template"><div class="lab-path"><label class="lab-field">Game executable<input type="text" data-game-path aria-label="Game executable" value="" spellcheck="false"></label><button type="button" class="lab-button cursor-interaction" data-browse style="align-self:end" aria-label="Browse for game executable"><i data-lucide="folder-open" aria-hidden="true"></i></button></div></template>
<template id="lab-fixes-template"><label class="lab-toggle"><span>Lighting Fix<span class="lab-small" data-feature-status="lighting" aria-live="polite">Waiting for game · requires NVIDIA.</span></span><input type="checkbox" class="lab-switch cursor-interaction" data-fix="lighting" aria-label="Lighting Fix" checked></label><label class="lab-toggle"><span>Q/E + Modbot fix<span class="lab-small" data-feature-status="modbot" aria-live="polite">Waiting for game.</span></span><input type="checkbox" class="lab-switch cursor-interaction" data-fix="modbot" aria-label="Q/E and Modbot fix" checked></label><label class="lab-toggle"><span>Hide AMD driver line<span class="lab-small">Remove “AMD Proprietary Driver” from game statistics.</span></span><input type="checkbox" class="lab-switch cursor-interaction" data-fix="driver" aria-label="Hide AMD Proprietary Driver" checked></label></template>
<template id="lab-tint-template"><div class="lab-slider-heading"><label>Red screen opacity <span class="lab-small" data-feature-status="tint" aria-live="polite"></span></label><output data-tint-output>100%</output></div><input type="range" class="lab-range cursor-interaction" aria-label="Low-health red screen opacity" min="0" max="100" value="100" data-tint><div class="lab-range-ends"><span>Clear · 0%</span><span>Default · 100%</span></div></template>
<template id="lab-help-template"><div class="lab-modal-shade" data-help-modal hidden><section class="lab-modal" role="dialog" aria-modal="true" aria-label="LAB Help"><div class="lab-modal-head"><h2>Help</h2><button class="lab-button cursor-interaction" type="button" data-close-help>Close</button></div><nav class="lab-help-tabs" role="tablist" aria-label="Help sections"><button type="button" role="tab" id="lab-indicators-tab" aria-controls="lab-indicators-panel" aria-selected="true" data-help-tab="indicators">Indicators</button><button type="button" role="tab" id="lab-commands-tab" aria-controls="lab-commands-panel" aria-selected="false" tabindex="-1" data-help-tab="commands">Console commands</button></nav><section id="lab-indicators-panel" role="tabpanel" aria-labelledby="lab-indicators-tab" data-help-panel="indicators"><p class="lab-help-intro">The in-game indicator shows <code>LAB</code> while connected. Enabled features appear in parentheses, always in <code>SLMHR</code> order.</p><table class="lab-indicator-table"><thead><tr><th>Flag</th><th>Feature</th><th>When shown</th></tr></thead><tbody><tr><td>S</td><td>Speedometers</td><td>The master switch and at least one meter are enabled.</td></tr><tr><td>L</td><td>Lighting Fix</td><td>The Lighting Fix switch is enabled.</td></tr><tr><td>M</td><td>Q/E + Modbot fix</td><td>The Q/E + Modbot fix switch is enabled.</td></tr><tr><td>H</td><td>Hide AMD driver line</td><td>Hide AMD driver line is enabled.</td></tr><tr><td>R</td><td>Red screen opacity</td><td>The selected opacity differs from 100%.</td></tr></tbody></table><p class="lab-small">Letters reflect selected settings. Actual availability, including Lighting Fix compatibility and Modbot standby, is shown under Game options.</p><p class="lab-small">All five: <code>LAB (SLMHR)</code>. Modbot and red tint only: <code>LAB (MR)</code>. No enabled features: <code>LAB</code>.</p><p class="lab-small">Without DESRU, LAB appears directly below FPS. With DESRU, LAB follows its text and precedes the AMD driver line when visible.</p></section><section id="lab-commands-panel" role="tabpanel" aria-labelledby="lab-commands-tab" data-help-panel="commands" hidden><div class="lab-command-list"><div><code>lab_speedometer_show 0|1</code><span>Overall visibility. Retain individual meter preferences.</span></div><div><code>lab_speedometer_showlanding 0|1</code><span>Show the last horizontal landing speed.</span></div><div><code>lab_speedometer_showvertical 0|1</code><span>Show vertical speed.</span></div><div><code>lab_speedometer_x_pos &lt;px&gt; [current|landing|vertical]</code><span>Horizontal position for one meter, or all if omitted.</span></div><div><code>lab_speedometer_y_pos &lt;px&gt; [current|landing|vertical]</code><span>Vertical position for one meter, or all if omitted.</span></div><div><code>lab_speedometer_color &lt;R&gt; &lt;G&gt; &lt;B&gt; [current|landing|vertical]</code><span>Independent RGB color, channels 0–255.</span></div><div><code>lab_speedometer_size &lt;0.1–10&gt; [current|landing|vertical]</code><span>Independent text size; omit the target to change all three.</span></div><div><code>lab_speedometer_verticalsign 0|1</code><span>1: +up / −down. 0: speed without a sign. Also available below Vertical.</span></div><div><code>lab_lowhptintopacity &lt;0–100&gt;</code><span>Opacity of both low-health red tint layers.</span></div></div><p class="lab-small" style="margin-top:20px">Enter a command without arguments to query its value and help.</p></section></section></div></template>
<template id="lab-inline-meters-template">
    <div class="lab-inline-row"><div class="lab-meter-name">Horizontal<div class="lab-small">Current speed</div></div><input type="checkbox" class="lab-switch cursor-interaction" data-meter="current" aria-label="Horizontal speedometer" checked><label class="lab-field"><span>X · px</span><input type="number" min="0" max="2147483647" step="10" value="160" data-inline-position="x" data-for="current" aria-label="Horizontal X position"></label><label class="lab-field"><span>Y · px</span><input type="number" min="0" max="2147483647" step="10" value="860" data-inline-position="y" data-for="current" aria-label="Horizontal Y position"></label><label class="lab-field"><span>Size</span><input type="number" min="0.1" max="10" step="0.1" value="3" data-inline-size="current" aria-label="Horizontal text size"></label><label class="lab-field"><span>Color</span><input type="color" class="lab-color cursor-interaction" value="#f1f1f1" data-inline-color="current" aria-label="Horizontal text color"></label></div>
    <div class="lab-inline-row"><div class="lab-meter-name">Landing<div class="lab-small">Last horizontal impact</div></div><input type="checkbox" class="lab-switch cursor-interaction" data-meter="landing" aria-label="Landing speedometer" checked><label class="lab-field"><span>X · px</span><input type="number" min="0" max="2147483647" step="10" value="720" data-inline-position="x" data-for="landing" aria-label="Landing X position"></label><label class="lab-field"><span>Y · px</span><input type="number" min="0" max="2147483647" step="10" value="860" data-inline-position="y" data-for="landing" aria-label="Landing Y position"></label><label class="lab-field"><span>Size</span><input type="number" min="0.1" max="10" step="0.1" value="3" data-inline-size="landing" aria-label="Landing text size"></label><label class="lab-field"><span>Color</span><input type="color" class="lab-color cursor-interaction" value="#e4ba73" data-inline-color="landing" aria-label="Landing text color"></label></div>
    <div class="lab-inline-row"><div class="lab-meter-name">Vertical<label class="lab-sign-option" title="Show + for upward speed and − for downward speed"><input type="checkbox" data-vertical-sign aria-label="Show vertical speed sign" checked><span>Show +/− sign</span></label></div><input type="checkbox" class="lab-switch cursor-interaction" data-meter="vertical" aria-label="Vertical speedometer" checked><label class="lab-field"><span>X · px</span><input type="number" min="0" max="2147483647" step="10" value="1280" data-inline-position="x" data-for="vertical" aria-label="Vertical X position"></label><label class="lab-field"><span>Y · px</span><input type="number" min="0" max="2147483647" step="10" value="860" data-inline-position="y" data-for="vertical" aria-label="Vertical Y position"></label><label class="lab-field"><span>Size</span><input type="number" min="0.1" max="10" step="0.1" value="3" data-inline-size="vertical" aria-label="Vertical text size"></label><label class="lab-field"><span>Color</span><input type="color" class="lab-color cursor-interaction" value="#8ad5e9" data-inline-color="vertical" aria-label="Vertical text color"></label></div>
  </template>
</div><script src="lab.js"></script></body></html>
