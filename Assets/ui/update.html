<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>LAB update</title><link rel="stylesheet" href="inline.css"><link rel="stylesheet" href="desktop.css"></head>
<body><div id="lab-frost-layouts"><div class="lab-app lab-inline lab-update" aria-label="LAB update">
<header class="lab-header"><div class="lab-brand"><span class="lab-emblem" role="img" aria-label="LAB emblem"></span><div class="lab-word">LAB</div><span class="lab-app-version" data-app-version aria-label="Application version"></span></div></header>
<div class="window-actions"><button type="button" data-action="minimize" aria-label="Minimize"><span class="minimize-icon"></span></button><button type="button" data-action="close" aria-label="Close"><span class="close-icon"></span></button></div>
<main class="lab-content"><h1 data-heading>Update available</h1><p class="lab-dialog-text" data-message></p><div class="lab-dialog-actions"><button type="button" class="lab-button" data-choice="skip">Don't ask again for this version</button><button type="button" class="lab-button" data-choice="no">No</button><button type="button" class="lab-button lab-primary" data-choice="yes">Yes</button><button type="button" class="lab-button" data-choice="continue" hidden>Continue</button></div></main>
</div></div><script src="update.js"></script></body></html>
